name: Bug report
description: A role, subagent, skill, or script is behaving incorrectly.
title: "[bug] "
labels: ["bug", "triage"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear, concise description of the bug.
      placeholder: "Verifier returned PASS on a diff with a failing unit test."
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal repro. Include the exact slash command, the task text, and any role output that shows the issue.
      placeholder: |
        1. Run `/pipeline Add a Foo component`
        2. Approve the plan
        3. Observe Verifier returning PASS despite `npm test` failing
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: "Verifier should return FAIL and cite the failing test."
    validations:
      required: true
  - type: dropdown
    id: role
    attributes:
      label: Which role / component?
      multiple: true
      options:
        - PM
        - Architect
        - Implementer
        - Reviewer
        - Prod-Readiness
        - Verifier
        - pipeline.md orchestrator
        - pipeline-lite.md orchestrator
        - repo-explorer subagent
        - frontend-reviewer subagent
        - test-runner subagent
        - prod-readiness subagent
        - verifier subagent
        - ft-bootstrap.sh
        - collect-pr-metrics.ts
        - docs / README
    validations:
      required: true
  - type: input
    id: tool
    attributes:
      label: AI tool + version
      description: e.g., Claude Code 1.x, GitHub Copilot in VS Code, etc.
    validations:
      required: true
  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      description: From `plugins/frontend-team/.claude-plugin/plugin.json#version`.
    validations:
      required: false
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Node version, relevant package versions.
      render: text
